name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python-sdk/pyproject.toml
      - run: python -m pip install --upgrade pip && pip install -e .[dev]
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src/
      - run: pytest --cov=vibelock --cov-report=xml --ignore=tests/interoperability/test_cross_sdk.py
      - uses: codecov/codecov-action@v4
        with:
          file: ./python-sdk/coverage.xml
          flags: python-${{ matrix.python-version }}

  python-cross-platform:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip && pip install -e .[dev]
      - run: pytest tests/ --ignore=tests/interoperability/test_cross_sdk.py
